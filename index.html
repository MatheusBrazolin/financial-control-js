<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">💰</div>
        <h1>Finance</h1>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-link active">📊 Dashboard</span>
      </nav>

      <div class="sidebar-footer">
        <!-- Dark mode: Use Ctrl+D para ativar -->
        <button id="theme-toggle" class="theme-btn" title="Atalho: Ctrl+D" style="opacity: 0.3; font-size: 0.8rem;">◐</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <header class="top-bar">
        <h2>Dashboard</h2>
        <button id="export-csv" class="btn-icon">📥</button>
      </header>

      <!-- QUICK STATS -->
      <section class="dashboard-grid">
        <div class="stat-card income">
          <div class="stat-header">
            <span class="stat-label">Entradas</span>
            <span class="stat-icon">↑</span>
          </div>
          <div class="stat-value" data-income>R$ 0,00</div>
          <div class="stat-footer">Este mês</div>
        </div>

        <div class="stat-card expense">
          <div class="stat-header">
            <span class="stat-label">Saídas</span>
            <span class="stat-icon">↓</span>
          </div>
          <div class="stat-value" data-expense>R$ 0,00</div>
          <div class="stat-footer">Este mês</div>
        </div>

        <div class="stat-card balance">
          <div class="stat-header">
            <span class="stat-label">Saldo</span>
            <span class="stat-icon">⚖️</span>
          </div>
          <div class="stat-value" data-balance>R$ 0,00</div>
          <div class="stat-footer">Disponível</div>
        </div>
      </section>

      <!-- MAIN GRID -->
      <div class="content-grid">
        <!-- LEFT: FORM -->
        <section class="card form-card">
          <h3>Nova Transação</h3>
          <form class="transaction-form" id="transaction-form">
            <div class="form-group">
              <label>Descrição</label>
              <input type="text" placeholder="O que você gastou ou recebeu?" class="form-input" data-field="descricao" required />
              <span class="form-error" data-error="descricao"></span>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Valor</label>
                <input type="text" placeholder="0,00" class="form-input" data-field="valor" id="valor-input" required />
                <span class="form-error" data-error="valor"></span>
              </div>

              <div class="form-group">
                <label>Categoria</label>
                <select class="form-input" data-field="categoria" required>
                  <option value="">Selecionar</option>
                  <option>Alimentação</option>
                  <option>Transporte</option>
                  <option>Moradia</option>
                  <option>Saúde</option>
                  <option>Lazer</option>
                  <option>Educação</option>
                  <option>Outros</option>
                </select>
                <span class="form-error" data-error="categoria"></span>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-success" data-type="entrada">+ Entrada</button>
              <button type="button" class="btn btn-danger" data-type="saida">- Saída</button>
            </div>
          </form>
        </section>

        <!-- RIGHT: CHART -->
        <section class="card chart-card">
          <h3>Gastos por Categoria</h3>
          <div class="chart-container">
            <canvas id="category-chart" width="280" height="280"></canvas>
          </div>
        </section>
      </div>

      <!-- TRANSACTIONS -->
      <section class="card">
        <div class="section-header">
          <h3>Transações</h3>
          <div class="section-controls">
            <input type="month" id="month-filter" class="filter-input" />
            <input type="text" id="search-input" placeholder="Buscar..." class="filter-input search" />
            <button id="filter-toggle" class="btn-filter">⚙️</button>
            <div class="filter-dropdown">
              <button class="filter-btn" data-type="all">Todas</button>
              <button class="filter-btn" data-type="entrada">Entradas</button>
              <button class="filter-btn" data-type="saida">Saídas</button>
            </div>
          </div>
        </div>

        <div id="empty-state" class="empty-state">
          <p>📭</p>
          <p>Nenhuma transação registrada</p>
        </div>

        <div class="transactions-table">
          <div class="table-header">
            <div class="col-date">Data</div>
            <div class="col-desc">Descrição</div>
            <div class="col-category">Categoria</div>
            <div class="col-value">Valor</div>
            <div class="col-actions">Ações</div>
          </div>
          <ul class="transaction-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
